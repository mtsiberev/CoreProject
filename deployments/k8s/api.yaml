apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 8080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z -v -w3 postgres-service 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
      
      containers:
      - name: api
        image: mystoreapi:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: RUN_MIGRATIONS_AT_START
          value: "true"
        - name: ConnectionStrings__DefaultConnection
          value: Host=postgres-service;Port=5432;Database=my_app_db;Username=admin;Password=password123
        - name: GrpcUrls__WarehouseService
          value: http://warehouse-service:8080
        - name: Kafka__BootstrapServers
          value: kafka-service:9092
        - name: MessageBroker__Provider
          value: Kafka
